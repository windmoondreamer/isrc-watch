name: 반도체 교육 공고 감시

on:
  schedule:
    # 매일 07:20 KST (22:20 UTC) — 클로드 아침 루틴(07:06 KST)보다 뒤에 돌려
    # 루틴이 이미 갱신한 DB 위에 신규 건만 얹는다.
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "쓰기 없이 수집 결과만 출력"
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 교육·공모전 소스 조회 → 노션 등록
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/watch.py ${{ inputs.dry_run && '--dry-run' || '' }}
